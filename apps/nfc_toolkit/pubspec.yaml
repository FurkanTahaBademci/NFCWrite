publish_to: 'none'

# version -> Android versionName, +build -> versionCode
version: 0.1.7+9

environment:
  sdk: ^3.12.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter

  # --- Cekirdek ---
  design_system: ^0.1.0
  localization: ^0.1.0
  nfc_core: ^0.1.0
  shared_utils: ^0.1.0

  # --- Servisler: SADECE composition root bunlari import eder ---
  ndef_codec: ^0.1.0

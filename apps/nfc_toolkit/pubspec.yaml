  # --- Ozellikler ---
  feature_history: ^0.1.0
  feature_read: ^0.1.0
  feature_settings: ^0.1.0
  feature_tools: ^0.1.0
  feature_write: ^0.1.0
  flutter_riverpod: ^3.4.2
  go_router: ^17.3.0
  crypto: ^3.0.6

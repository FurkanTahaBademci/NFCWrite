<title>Kişi Kartı · NFC Toolkit</title>
<!--

  NFC kartındaki URI kaydı bu sayfaya işaret eder:
    https://furkantahabademci.github.io/NFCWrite/v/#<base64url(vCard)>

  Kişi verisi yalnızca URL fragment'ında (#) taşınır; fragment tarayıcı
  tarafından sunucuya GÖNDERİLMEZ. Bu sayfa veriyi tamamen istemci
  tarafında çözer ve .vcf indirmesi sunar. Hiçbir dış kaynak (font,
  görsel, script, analytics) yüklenmez; sayfa kendiliğinden hiçbir yere
  istek atmaz. Yalnızca kullanıcının dokunduğu bağlantılar (tel:,
  mailto:, harita, sosyal medya) dışarı çıkar.

  DİKKAT: Bu sayfanın adresi fiziksel kartlara kalıcı yazılıyor.
  Taşırsan/silersen sahadaki kartlar kırılır. Adres sözleşmesi:
  packages/services/ndef_codec/lib/src/vcard_share_link.dart

  Bu dosya tek başına çalışır: harici bağımlılık, derleme adımı yok.
-->

    /* Marka turkuazı #46b5c9 (logodan alındı). Etkileşimli yüzeyler için
       WCAG AA'yı tuttururken aynı tonda koyu/açık varyantlar kullanılır. */
    --bg: #f1f6f8;
    --bg-glow: rgba(70, 181, 201, .18);
    --card: #ffffff;
    --text: #0d1a1f;
    --muted: #5b6b72;
    --line: #e2ebee;
    --line-soft: #eef4f6;
    --brand: #0f7c8c;        /* beyaz üzerinde 4.9:1 */
    --brand-ink: #0b6675;    /* bağlantı metni, 6.4:1 */
    --brand-logo: #46b5c9;   /* logonun ham rengi — sadece dekoratif */
    --brand-soft: rgba(70, 181, 201, .16);
    --on-brand: #ffffff;
    --chip: #eef4f6;
    --chip-active: #ffffff;
    --shadow: 0 1px 2px rgba(13, 26, 31, .05), 0 18px 40px -18px rgba(13, 26, 31, .32);
    --radius: 1.5rem;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0a1215;
      --bg-glow: rgba(70, 181, 201, .14);
      --card: #131c21;
      --text: #e7eff1;
      --muted: #93a7ae;
      --line: #222e34;
      --line-soft: #1a242a;
      --brand: #52d0e0;      /* kart zemininde 9.5:1 */
      --brand-ink: #6ad8e6;
      --brand-logo: #46b5c9;
      --brand-soft: rgba(70, 181, 201, .18);
      --on-brand: #04222a;
      --chip: #1b262c;
      --chip-active: #2e3d45;
      --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 20px 48px -20px rgba(0, 0, 0, .8);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
                 "Helvetica Neue", Arial, sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(60rem 26rem at 50% -8rem, var(--bg-glow), transparent 70%);
    background-repeat: no-repeat;
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: .75rem;
    padding:
      calc(1rem + env(safe-area-inset-top)) calc(1rem + env(safe-area-inset-right))
      calc(1rem + env(safe-area-inset-bottom)) calc(1rem + env(safe-area-inset-left));
  }

  .shell { width: 100%; max-width: 27rem; }

  /* ---- üst çubuk: marka + dil seçimi --------------------------------- */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: .75rem; margin-bottom: .6rem; padding: 0 .15rem;
  }
  .brand { display: flex; align-items: center; gap: .5rem; min-width: 0; }
  .brand .logo {
    flex: 0 0 auto; width: 1.65rem; height: 1.65rem;
    border-radius: 23%;
    background: var(--logo) center / cover no-repeat, var(--brand-logo);
    box-shadow: 0 1px 3px rgba(13, 26, 31, .22);
  }
  .brand .name {
    font-size: .82rem; font-weight: 620; letter-spacing: -.005em;
    color: var(--muted); white-space: nowrap;
  }
  .langs {
    display: inline-flex; gap: .125rem; padding: .175rem;
    background: var(--chip); border-radius: 999px;
  }
  .langs button {
    appearance: none; border: 0; background: transparent; cursor: pointer;
    font: inherit; font-size: .75rem; font-weight: 600; letter-spacing: .04em;
    color: var(--muted); padding: .3rem .6rem; border-radius: 999px;
    transition: background .18s ease, color .18s ease;
  }
  .langs button[aria-pressed="true"] {
    background: var(--chip-active); color: var(--text);
    box-shadow: 0 1px 2px rgba(13, 26, 31, .14);
  }

  /* ---- kart ---------------------------------------------------------- */
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
    animation: rise .38s cubic-bezier(.2, .7, .3, 1) both;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(12px); }
    to   { opacity: 1; transform: none; }
  }

  .hero {
    position: relative;
    padding: 1.75rem 1.5rem 1.25rem;
    text-align: center;
    background: linear-gradient(180deg, var(--brand-soft), transparent);
    border-bottom: 1px solid var(--line-soft);
  }
  .avatar {
    width: 4.5rem; height: 4.5rem; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 1.7rem; font-weight: 650; letter-spacing: .01em;
    color: #fff; margin-bottom: .8rem;
    box-shadow: 0 8px 20px -8px rgba(15, 23, 42, .55);
    user-select: none;
  }
  .hero h1 {
    font-size: 1.5rem; font-weight: 660; line-height: 1.22;
    letter-spacing: -.015em; overflow-wrap: anywhere;
  }
  .hero .sub {
    color: var(--muted); font-size: .95rem; margin-top: .3rem;
    overflow-wrap: anywhere;
  }

  /* ---- alanlar ------------------------------------------------------- */
  .rows { padding: .35rem .5rem; }
  .rowline {
    display: flex; align-items: center; gap: .25rem;
    border-bottom: 1px solid var(--line-soft);
  }
  .rows .rowline:last-child { border-bottom: 0; }

  .row {
    flex: 1 1 auto; min-width: 0;
    display: flex; align-items: center; gap: .8rem;
    padding: .8rem .6rem;
    color: inherit; text-decoration: none;
    border-radius: .85rem;
    -webkit-tap-highlight-color: transparent;
  }
  .row .ico {
    flex: 0 0 auto; width: 2.25rem; height: 2.25rem; border-radius: .7rem;
    background: var(--brand-soft); color: var(--brand);
    display: grid; place-items: center;
  }
  .row .ico svg { width: 1.15rem; height: 1.15rem; }
  .row .txt { min-width: 0; }
  .row .k {
    display: block; font-size: .68rem; font-weight: 600;
    text-transform: uppercase; letter-spacing: .07em;
    color: var(--muted); margin-bottom: .05rem;
  }
  .row .v { display: block; font-size: 1rem; overflow-wrap: anywhere; }
  .row .v.multi { white-space: pre-wrap; font-size: .95rem; }
  /* uzun adresler tek satırda kalsın; tam değer kopyalama düğmesinde */
  .row .v.trunc { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  a.row .v { color: var(--brand-ink); }

  .copy {
    flex: 0 0 auto; appearance: none; border: 0; background: transparent;
    color: var(--muted); cursor: pointer; padding: .55rem; margin-right: .1rem;
    border-radius: .65rem; display: grid; place-items: center;
    -webkit-tap-highlight-color: transparent;
    transition: color .18s ease, background .18s ease;
  }
  .copy svg { width: 1.05rem; height: 1.05rem; }
  .copy.done { color: var(--brand); }

  @media (hover: hover) {
    a.row:hover { background: var(--brand-soft); }
    .copy:hover { color: var(--text); background: var(--chip); }
  }
  a.row:active, .copy:active { background: var(--chip); }

  /* ---- eylemler ------------------------------------------------------ */
  .actions { padding: 1rem 1.25rem 1.35rem; }
  .btn {
    width: 100%; appearance: none; border: 0; cursor: pointer; font: inherit;
    display: inline-flex; align-items: center; justify-content: center;
    gap: .5rem; padding: .95rem 1rem; border-radius: .9rem;
    font-size: 1.02rem; font-weight: 620;
    background: var(--brand); color: var(--on-brand);
    box-shadow: 0 10px 22px -12px var(--brand);
    -webkit-tap-highlight-color: transparent;
    transition: transform .12s ease, filter .18s ease;
  }
  .btn svg { width: 1.15rem; height: 1.15rem; }
  .btn:active { transform: scale(.985); filter: brightness(.96); }

  .quick { display: flex; gap: .5rem; margin-top: .6rem; }
  .quick .btn {
    background: var(--chip); color: var(--text); box-shadow: none;
    font-size: .9rem; font-weight: 600; padding: .7rem .5rem;
  }
  .quick .btn svg { width: 1rem; height: 1rem; color: var(--muted); }

  .hint {
    display: flex; gap: .55rem; align-items: flex-start;
    color: var(--muted); font-size: .82rem; line-height: 1.45;
    margin-top: .9rem; padding: .7rem .8rem;
    background: var(--chip); border-radius: .8rem;
  }
  .hint svg { flex: 0 0 auto; width: .95rem; height: .95rem; margin-top: .18rem; }
  .hint strong { color: var(--text); font-weight: 620; }

  :focus-visible {
    outline: 2px solid var(--brand); outline-offset: 2px; border-radius: .5rem;
  }

  /* ---- boş / hatalı durum -------------------------------------------- */
  .empty { padding: 2.4rem 1.6rem 2rem; text-align: center; }
  .empty .mark {
    width: 4rem; height: 4rem; border-radius: 23%; margin: 0 auto 1.1rem;
    background: var(--logo) center / cover no-repeat, var(--brand-logo);
    box-shadow: 0 6px 18px -8px rgba(13, 26, 31, .5);
  }
  .empty h1 { font-size: 1.15rem; font-weight: 640; margin-bottom: .45rem; }
  .empty p { color: var(--muted); font-size: .92rem; }
  .empty p + p { margin-top: .6rem; }

  /* ---- alt bilgi ------------------------------------------------------ */
  .foot {
    display: flex; align-items: center; justify-content: center; gap: .4rem;
    color: var(--muted); font-size: .76rem; text-align: center;
    padding: 0 .5rem;
  }
  .foot svg { width: .85rem; height: .85rem; flex: 0 0 auto; }

  /* ---- bildirim ------------------------------------------------------- */
  .toast {
    position: fixed; left: 50%; bottom: calc(1.25rem + env(safe-area-inset-bottom));
    transform: translate(-50%, 1.5rem);
    background: var(--text); color: var(--bg);
    font-size: .85rem; font-weight: 550;
    padding: .6rem 1rem; border-radius: 999px;
    box-shadow: 0 12px 28px -10px rgba(0, 0, 0, .6);
    opacity: 0; pointer-events: none;
    transition: opacity .2s ease, transform .2s ease;
    max-width: calc(100vw - 2rem);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: .001ms !important; transition-duration: .001ms !important;
    }
  }
</style>
</head>
<body>

<div class="shell">
  <div class="topbar">
    <div class="brand">
      <span class="logo" role="img" aria-label="NFC Toolkit"></span>
      <span class="name">NFC Toolkit</span>
    </div>
    <div class="langs" role="group" id="langs" aria-label="Dil / Language">
      <button type="button" data-lang="tr" aria-pressed="true">TR</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </div>

  <main class="card" id="app">
    <div class="empty">
      <div class="mark" aria-hidden="true"></div>
      <h1 id="empty-title">Kişi kartı bulunamadı</h1>
      <p id="empty-body">
        Bu sayfa bir NFC kişi kartına dokunduğunda açılır ve kartın üzerindeki
        kişi bilgisini gösterir. Adres doğrudan açıldığı için gösterilecek bir
        kart verisi yok.
      </p>
    </div>
  </main>

  <noscript>
    <p style="text-align:center;color:#667085;font-size:.85rem;margin-top:.75rem">
      Kişi kartını görüntülemek için JavaScript gerekir. ·
      JavaScript is required to display this contact card.
    </p>
  </noscript>
</div>

<p class="foot" id="foot">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="4" y="10.5" width="16" height="10.5" rx="2.5"/>
    <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
  </svg>
  <span id="foot-text">Kişi bilgisi kartın üzerinde taşınır, sunucuya gönderilmez.</span>
</p>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';

  /* ------------------------------------------------------------------ *
   * 1) Metinler — TR/EN                                                 *
   * ------------------------------------------------------------------ */
  var STR = {
    tr: {
      docTitle: 'Kişi Kartı',
      emptyTitle: 'Kişi kartı bulunamadı',
      emptyBody: 'Bu sayfa bir NFC kişi kartına dokunduğunda açılır ve kartın ' +
                 'üzerindeki kişi bilgisini gösterir. Adres doğrudan açıldığı ' +
                 'için gösterilecek bir kart verisi yok.',
      brokenTitle: 'Kart verisi okunamadı',
      brokenBody: 'Bağlantıdaki kişi verisi bozuk ya da eksik görünüyor. ' +
                  'Bağlantı kopyalanırken kısaltılmış olabilir; karta yeniden ' +
                  'dokunmayı deneyin.',

      homePhone: 'Ev telefonu', fax: 'Faks',
      email: 'E-posta', workEmail: 'İş e-postası', homeEmail: 'Kişisel e-posta',
      address: 'Adres', web: 'Web sitesi', note: 'Not',
      save: 'Kişilere Ekle', call: 'Ara', mail: 'E-posta', share: 'Paylaş',
      copied: 'Kopyalandı', copyFailed: 'Kopyalanamadı', copyAria: 'Kopyala',
      downloaded: 'Kişi kartı indirildi',
      hintIos: '<strong>iPhone:</strong> indirilen dosyaya dokunun, ardından ' +
               '“Yeni Kişi Oluştur”u seçin. Dosya Safari’nin indirilenler ' +
               'listesinde (adres çubuğundaki ok) yer alır.',
      hintAndroid: '<strong>Android:</strong> indirilen .vcf dosyasına dokunup ' +
                   'Kişiler uygulamasıyla açın.',
      hintDesktop: '<strong>Bilgisayar:</strong> indirilen .vcf dosyasını ' +
                   'rehber uygulamanızla açın.',
      foot: 'Kişi bilgisi kartın üzerinde taşınır, sunucuya gönderilmez.',
      shareTitle: 'Kişi kartı'
    },
    en: {
      docTitle: 'Contact Card',
      emptyTitle: 'No contact card found',
      emptyBody: 'This page opens when you tap an NFC contact card and shows ' +
                 'the contact stored on it. It was opened directly, so there ' +
                 'is no card data to display.',
      brokenTitle: 'Card data unreadable',
      brokenBody: 'The contact data in this link looks corrupted or incomplete. ' +
                  'It may have been truncated when the link was copied — try ' +
                  'tapping the card again.',
      phone: 'Phone', mobile: 'Mobile', workPhone: 'Work phone',
      homePhone: 'Home phone', fax: 'Fax',
      email: 'Email', workEmail: 'Work email', homeEmail: 'Personal email',
      address: 'Address', web: 'Website', note: 'Note',
      save: 'Add to Contacts', call: 'Call', mail: 'Email', share: 'Share',
      copied: 'Copied', copyFailed: 'Copy failed', copyAria: 'Copy',
      downloaded: 'Contact card downloaded',
      hintIos: '<strong>iPhone:</strong> tap the downloaded file, then choose ' +
               '“Create New Contact”. You will find it in Safari’s downloads ' +
               '(the arrow in the address bar).',
      hintAndroid: '<strong>Android:</strong> tap the downloaded .vcf file and ' +
                   'open it with the Contacts app.',
      hintDesktop: '<strong>Desktop:</strong> open the downloaded .vcf file ' +
                   'with your address book app.',
      foot: 'Contact data lives on the card itself — it is never sent to a server.',
      shareTitle: 'Contact card'
    }
  };

  var lang = pickLang();
  function t(key) { return STR[lang][key]; }

  function pickLang() {
    try {
      var saved = localStorage.getItem('nfcv.lang');
      if (saved === 'tr' || saved === 'en') return saved;
    } catch (e) { /* localStorage kapalı olabilir */ }
    var nav = (navigator.language || 'tr').toLowerCase();
    return nav.indexOf('tr') === 0 ? 'tr' : 'en';
  }

  /* ------------------------------------------------------------------ *
   * 2) Simgeler — sabit SVG'ler (kullanıcı verisi içermez)              *
   * ------------------------------------------------------------------ */
  var ICONS = {
    phone: '<path d="M21.5 16.9v2.6a2 2 0 0 1-2.2 2 19.6 19.6 0 0 1-8.6-3.1 19.3 19.3 0 0 1-5.9-5.9A19.6 19.6 0 0 1 1.7 3.9 2 2 0 0 1 3.7 1.7h2.6a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.4 2.1L7.5 9.4a16 16 0 0 0 6 6l1.1-1.1a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/>',
    mail: '<rect x="2.5" y="4.5" width="19" height="15" rx="2.5"/><path d="m3 7.5 8.4 5.4a1.5 1.5 0 0 0 1.7 0L21 7.5"/>',
    pin: '<path d="M12 21.5s7-5.7 7-11.2a7 7 0 1 0-14 0C5 15.8 12 21.5 12 21.5z"/><circle cx="12" cy="10" r="2.6"/>',
    globe: '<circle cx="12" cy="12" r="9.2"/><path d="M2.9 12h18.2"/><path d="M12 2.8a14.5 14.5 0 0 1 0 18.4 14.5 14.5 0 0 1 0-18.4z"/>',
    note: '<rect x="4.5" y="3" width="15" height="18" rx="2.5"/><path d="M8.5 8.5h7M8.5 12.5h7M8.5 16.5h4"/>',
    userPlus: '<path d="M15.5 20.5v-1.8a4 4 0 0 0-4-4h-4a4 4 0 0 0-4 4v1.8"/><circle cx="9.5" cy="7.5" r="3.7"/><path d="M18.5 7.5v6M21.5 10.5h-6"/>',
    copy: '<rect x="9" y="9" width="11.5" height="11.5" rx="2.5"/><path d="M5.5 15h-.8A2.2 2.2 0 0 1 2.5 12.8V5.7A2.2 2.2 0 0 1 4.7 3.5h7.1A2.2 2.2 0 0 1 14 5.7v.8"/>',
    check: '<path d="m20 6.5-10.5 11L4 12"/>',
    share: '<circle cx="18" cy="5.5" r="2.9"/><circle cx="6" cy="12" r="2.9"/><circle cx="18" cy="18.5" r="2.9"/><path d="m8.6 13.4 6.8 3.7M15.4 6.9 8.6 10.6"/>',
    info: '<circle cx="12" cy="12" r="9.2"/><path d="M12 11v5.5M12 7.6h.01"/>'
  };

  function icon(name, cls) {
    var span = document.createElement('span');
    span.className = cls || '';
    span.setAttribute('aria-hidden', 'true');
    span.innerHTML =
      '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
      'stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">' +
      ICONS[name] + '</svg>';
    return span;
  }

  /* ------------------------------------------------------------------ *
   * 3) Çözümleme — base64url → vCard → nesne                            *
   * ------------------------------------------------------------------ */
  function b64urlDecode(s) {
    s = s.replace(/\s+/g, '').replace(/-/g, '+').replace(/_/g, '/');
    while (s.length % 4) s += '=';
    var bin = atob(s);
    var bytes = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return new TextDecoder('utf-8', { fatal: true }).decode(bytes);
  }

  function unescapeV(s) {
    return s.replace(/\\n/gi, '\n').replace(/\\,/g, ',')
            .replace(/\\;/g, ';').replace(/\\\\/g, '\\');
  }

  /** Katlanmış satırları birleştirir (RFC 2426 §2.6). */
  function unfold(text) {
    var raw = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n');
    var lines = [];
    for (var i = 0; i < raw.length; i++) {
      var line = raw[i];
      if ((line[0] === ' ' || line[0] === '\t') && lines.length) {
        lines[lines.length - 1] += line.slice(1);
      } else if (line.length) {
        lines.push(line);
      }
    }
    return lines;
  }

  /** `TEL;TYPE=CELL,VOICE` → ['CELL', 'VOICE'] */
  function typesOf(paramText) {
    var out = [];
    paramText.split(';').slice(1).forEach(function (p) {
      var eq = p.indexOf('=');
      var key = (eq < 0 ? p : p.slice(0, eq)).toUpperCase();
      var val = eq < 0 ? p : p.slice(eq + 1);
      if (eq < 0 || key === 'TYPE') {
        val.split(',').forEach(function (v) {
          v = v.replace(/^"|"$/g, '').trim().toUpperCase();
          if (v) out.push(v);
        });
      }
    });
    return out;
  }

  function parseVCard(text) {
    var c = { tels: [], emails: [], urls: [] };

    unfold(text).forEach(function (line) {
      var idx = line.indexOf(':');
      if (idx <= 0) return;
      var head = line.slice(0, idx);
      var key = head.split(';')[0].replace(/^[^.]+\./, '').toUpperCase();
      var val = line.slice(idx + 1);
      if (!val.trim()) return;
      var types = typesOf(head);

      switch (key) {
        case 'FN': c.fn = unescapeV(val).trim(); break;
        case 'N':
          var n = val.split(';').map(unescapeV);
          c.family = (n[0] || '').trim();
          c.given = (n[1] || '').trim();
          break;
        case 'ORG':
          c.org = val.split(';').map(unescapeV)
                     .filter(function (p) { return p.trim(); }).join(' · ');
          break;
        case 'TITLE': c.title = unescapeV(val).trim(); break;
        case 'TEL': c.tels.push({ value: unescapeV(val).trim(), types: types }); break;
        case 'EMAIL': c.emails.push({ value: unescapeV(val).trim(), types: types }); break;
        case 'NOTE': c.note = unescapeV(val).trim(); break;
        case 'URL': c.urls.push(unescapeV(val).trim()); break;
        case 'ADR':
          // ADR alanları: kutu;ek;sokak;şehir;bölge;posta;ülke
          var parts = val.split(';').map(unescapeV).slice(2)
                         .filter(function (p) { return p.trim(); });
          if (parts.length) c.adr = parts.join(', ');
          break;
      }
    });

    // FN yoksa N / ORG / ilk iletişim bilgisinden başlık üret.
    if (!c.fn) {
      var composed = [c.given, c.family].filter(Boolean).join(' ').trim();
      c.fn = composed || c.org ||
             (c.tels[0] && c.tels[0].value) ||
             (c.emails[0] && c.emails[0].value) || '';
    }

    var hasAny = c.fn || c.tels.length || c.emails.length || c.urls.length ||
                 c.adr || c.note;
    return hasAny ? c : null;
  }

  /* ------------------------------------------------------------------ *
   * 4) Etiketleme ve bağlantı üretimi                                   *
   * ------------------------------------------------------------------ */
  function telLabel(types) {
    if (types.indexOf('FAX') >= 0) return t('fax');
    if (types.indexOf('CELL') >= 0 || types.indexOf('MOBILE') >= 0) return t('mobile');
    if (types.indexOf('WORK') >= 0) return t('workPhone');
    if (types.indexOf('HOME') >= 0) return t('homePhone');
    return t('phone');
  }

  function mailLabel(types) {
    if (types.indexOf('WORK') >= 0) return t('workEmail');
    if (types.indexOf('HOME') >= 0) return t('homeEmail');
    return t('email');
  }

  /** Sadece http/https'e izin verir; şema uydurmaya çalışmaz. */
  function safeUrl(raw) {
    var candidate = /^[a-z][a-z0-9+.-]*:/i.test(raw) ? raw : 'https://' + raw;
    try {
      var u = new URL(candidate);
      if (u.protocol !== 'http:' && u.protocol !== 'https:') return null;
      return u;
    } catch (e) { return null; }
  }

  var SOCIALS = [
    { host: /(^|\.)instagram\.com$/, name: 'Instagram', handle: true },
    { host: /(^|\.)(twitter|x)\.com$/, name: 'X', handle: true },
    { host: /(^|\.)linkedin\.com$/, name: 'LinkedIn' },
    { host: /(^|\.)github\.com$/, name: 'GitHub', handle: true },
    { host: /(^|\.)facebook\.com$/, name: 'Facebook', handle: true },
    { host: /(^|\.)youtube\.com$/, name: 'YouTube' },
    { host: /(^|\.)tiktok\.com$/, name: 'TikTok' },
    { host: /(^|\.)(wa\.me|whatsapp\.com)$/, name: 'WhatsApp' },
    { host: /(^|\.)(t\.me|telegram\.me)$/, name: 'Telegram', handle: true }
  ];

  /** Bağlantıyı okunur hale getirir: etiket + kısa gösterim. */
  function describeUrl(u) {
    var host = u.hostname.replace(/^www\./, '');
    var path = u.pathname.replace(/\/+$/, '');
    var firstSeg = path.split('/').filter(Boolean)[0] || '';

    for (var i = 0; i < SOCIALS.length; i++) {
      if (SOCIALS[i].host.test(host)) {
        var shown = SOCIALS[i].handle && firstSeg
          ? '@' + firstSeg.replace(/^@/, '')
          : (host + path) || host;
        return { label: SOCIALS[i].name, text: shown };
      }
    }
    return { label: t('web'), text: host + path };
  }

  function mapsUrl(address) {
    var q = encodeURIComponent(address);
    return /iPhone|iPad|iPod|Macintosh/i.test(navigator.userAgent)
      ? 'https://maps.apple.com/?q=' + q
      : 'https://www.google.com/maps/search/?api=1&query=' + q;
  }

  /* ------------------------------------------------------------------ *
   * 5) Görsel yardımcılar                                               *
   * ------------------------------------------------------------------ */
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function initialsOf(name) {
    var words = name.trim().split(/\s+/).filter(Boolean);
    var chars = words.slice(0, 2).map(function (w) {
      return Array.from(w)[0] || '';
    });
    var out = chars.join('').toUpperCase();
    return out || '#';
  }

  /** İsimden deterministik bir renk üretir — aynı kişi her zaman aynı renk.
   *  Ton, marka turkuazının (189°) ±26° komşuluğunda tutulur; böylece her
   *  kart kendine özgü ama palet dışına çıkmayan bir renk alır. */
  function hueOf(name) {
    var h = 0;
    for (var i = 0; i < name.length; i++) {
      h = (h * 31 + name.charCodeAt(i)) % 52;
    }
    return 189 - 26 + h;
  }

  var toastTimer;
  function toast(message) {
    var box = document.getElementById('toast');
    box.textContent = message;
    box.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { box.classList.remove('show'); }, 2200);
  }

  function copyText(text, done) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () { done(true); },
                                               function () { done(false); });
      return;
    }
    try {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly', '');
      ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
      document.body.appendChild(ta);
      ta.select();
      var ok = document.execCommand('copy');
      ta.remove();
      done(ok);
    } catch (e) { done(false); }
  }

  /* ------------------------------------------------------------------ *
   * 6) Satır ve eylem yapımı                                            *
   * ------------------------------------------------------------------ */
  function addRow(parent, opts) {
    var line = el('div', 'rowline');

    var row = el(opts.href ? 'a' : 'div', 'row');
    if (opts.href) {
      row.href = opts.href;
      if (opts.external) { row.rel = 'noopener noreferrer'; row.target = '_blank'; }
    }
    row.appendChild(icon(opts.icon, 'ico'));

    var txt = el('div', 'txt');
    txt.appendChild(el('span', 'k', opts.label));
    var vCls = 'v' + (opts.multiline ? ' multi' : '') + (opts.truncate ? ' trunc' : '');
    txt.appendChild(el('span', vCls, opts.text));
    row.appendChild(txt);
    line.appendChild(row);

    if (opts.copy !== false) {
      var btn = el('button', 'copy');
      btn.type = 'button';
      btn.setAttribute('aria-label', t('copyAria') + ': ' + opts.label);
      btn.appendChild(icon('copy'));
      btn.addEventListener('click', function () {
        copyText(opts.copyValue || opts.text, function (ok) {
          toast(ok ? t('copied') : t('copyFailed'));
          if (!ok) return;
          btn.textContent = '';
          btn.appendChild(icon('check'));
          btn.classList.add('done');
          setTimeout(function () {
            btn.textContent = '';
            btn.appendChild(icon('copy'));
            btn.classList.remove('done');
          }, 1600);
        });
      });
      line.appendChild(btn);
    }

    parent.appendChild(line);
  }

  function actionButton(label, iconName, onClick) {
    var b = el('button', 'btn');
    b.type = 'button';
    b.appendChild(icon(iconName));
    b.appendChild(el('span', null, label));
    b.addEventListener('click', onClick);
    return b;
  }

  function vcfFile(contact, vcfText) {
    var base = contact.fn.replace(/[^\p{L}\p{N} _-]/gu, '').trim() || 'contact';
    return new File([vcfText], base + '.vcf', { type: 'text/vcard;charset=utf-8' });
  }

  function downloadVcf(contact, vcfText) {
    var file = vcfFile(contact, vcfText);
    var url = URL.createObjectURL(file);
    var a = document.createElement('a');
    a.href = url;
    a.download = file.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 30000);
    toast(t('downloaded'));
  }

  function platformHintKey() {
    var ua = navigator.userAgent;
    var isIos = /iPhone|iPad|iPod/i.test(ua) ||
                (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
    if (isIos) return 'hintIos';
    if (/Android/i.test(ua)) return 'hintAndroid';
    return 'hintDesktop';
  }

  /* ------------------------------------------------------------------ *
   * 7) Ekranlar                                                         *
   * ------------------------------------------------------------------ */
  function renderMessage(titleKey, bodyKey) {
    var app = document.getElementById('app');
    app.textContent = '';

    var box = el('div', 'empty');
    var mark = el('div', 'mark');
    mark.setAttribute('role', 'img');
    mark.setAttribute('aria-label', 'NFC Toolkit');
    box.appendChild(mark);
    box.appendChild(el('h1', null, t(titleKey)));
    box.appendChild(el('p', null, t(bodyKey)));
    app.appendChild(box);

    document.title = t('docTitle') + ' · NFC Toolkit';
  }

  function renderContact(c, vcfText) {
    var app = document.getElementById('app');
    app.textContent = '';

    /* --- başlık --- */
    var hero = el('div', 'hero');
    var hue = hueOf(c.fn);
    var avatar = el('div', 'avatar', initialsOf(c.fn));
    avatar.setAttribute('aria-hidden', 'true');
    avatar.style.background =
      'linear-gradient(135deg, hsl(' + hue + ' 58% 40%), hsl(' +
      (hue + 16) + ' 62% 29%))';
    hero.appendChild(avatar);
    hero.appendChild(el('h1', null, c.fn));

    var subParts = [];
    if (c.title) subParts.push(c.title);
    if (c.org) subParts.push(c.org);
    if (subParts.length) hero.appendChild(el('p', 'sub', subParts.join(' · ')));
    app.appendChild(hero);

    /* --- alanlar --- */
    var rows = el('div', 'rows');

    c.tels.forEach(function (tel) {
      addRow(rows, {
        icon: 'phone',
        label: telLabel(tel.types),
        text: tel.value,
        href: 'tel:' + tel.value.replace(/[^\d+*#]/g, '')
      });
    });

    c.emails.forEach(function (mail) {
      addRow(rows, {
        icon: 'mail',
        label: mailLabel(mail.types),
        text: mail.value,
        href: 'mailto:' + encodeURIComponent(mail.value).replace(/%40/g, '@')
      });
    });

    if (c.adr) {
      addRow(rows, {
        icon: 'pin',
        label: t('address'),
        text: c.adr,
        href: mapsUrl(c.adr),
        external: true
      });
    }

    c.urls.forEach(function (raw) {
      var u = safeUrl(raw);
      if (!u) return;
      var d = describeUrl(u);
      addRow(rows, {
        icon: 'globe',
        label: d.label,
        text: d.text,
        copyValue: u.href,
        href: u.href,
        external: true,
        truncate: true
      });
    });

    if (c.note) {
      addRow(rows, {
        icon: 'note',
        label: t('note'),
        text: c.note,
        multiline: true
      });
    }

    if (rows.children.length) app.appendChild(rows);

    /* --- eylemler --- */
    var actions = el('div', 'actions');
    actions.appendChild(actionButton(t('save'), 'userPlus', function () {
      downloadVcf(c, vcfText);
    }));

    var quick = el('div', 'quick');
    if (c.tels.length) {
      quick.appendChild(actionButton(t('call'), 'phone', function () {
        location.href = 'tel:' + c.tels[0].value.replace(/[^\d+*#]/g, '');
      }));
    }
    if (c.emails.length) {
      quick.appendChild(actionButton(t('mail'), 'mail', function () {
        location.href = 'mailto:' +
          encodeURIComponent(c.emails[0].value).replace(/%40/g, '@');
      }));
    }
    if (navigator.share) {
      quick.appendChild(actionButton(t('share'), 'share', function () {
        var file = vcfFile(c, vcfText);
        var payload = { title: t('shareTitle'), text: c.fn };
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          payload.files = [file];
        } else {
          payload.url = location.href;
        }
        navigator.share(payload).catch(function () { /* kullanıcı vazgeçti */ });
      }));
    }
    if (quick.children.length) actions.appendChild(quick);

    var hint = el('div', 'hint');
    hint.appendChild(icon('info'));
    var hintText = el('p');
    hintText.innerHTML = t(platformHintKey()); // sabit metin, kullanıcı verisi yok
    hint.appendChild(hintText);
    actions.appendChild(hint);

    app.appendChild(actions);

    document.title = c.fn + ' · ' + t('docTitle');
  }

  /* ------------------------------------------------------------------ *
   * 8) Yönlendirme + dil değişimi                                       *
   * ------------------------------------------------------------------ */
  var state = { view: 'empty', contact: null, vcf: null };

  function draw() {
    document.documentElement.lang = lang;
    document.getElementById('foot-text').textContent = t('foot');
    Array.prototype.forEach.call(
      document.querySelectorAll('#langs button'),
      function (b) {
        b.setAttribute('aria-pressed', String(b.dataset.lang === lang));
      }
    );

    if (state.view === 'contact') renderContact(state.contact, state.vcf);
    else if (state.view === 'broken') renderMessage('brokenTitle', 'brokenBody');
    else renderMessage('emptyTitle', 'emptyBody');
  }

  document.getElementById('langs').addEventListener('click', function (ev) {
    var btn = ev.target.closest('button[data-lang]');
    if (!btn || btn.dataset.lang === lang) return;
    lang = btn.dataset.lang;
    try { localStorage.setItem('nfcv.lang', lang); } catch (e) { /* yoksay */ }
    draw();
  });

  function load() {
    var frag = location.hash.slice(1).trim();
    if (!frag) { state.view = 'empty'; return; }

    try {
      var vcfText = b64urlDecode(decodeURIComponent(frag));
      var contact = parseVCard(vcfText);
      if (!contact) { state.view = 'broken'; return; }
      state.view = 'contact';
      state.contact = contact;
      state.vcf = vcfText;
    } catch (e) {
      state.view = 'broken';
    }
  }

  /** Sekme simgesini CSS'teki --logo data URI'sinden kurar; böylece logo
   *  base64'ü dosyada bir kez geçer. */
  function installFavicon() {
    var raw = getComputedStyle(document.documentElement)
      .getPropertyValue('--logo').trim();
    var match = raw.match(/url\(\s*["']?([^"')]+)["']?\s*\)/);
    if (!match) return;
    ['icon', 'apple-touch-icon'].forEach(function (rel) {
      var link = document.createElement('link');
      link.rel = rel;
      link.href = match[1];
      document.head.appendChild(link);
    });
  }

  // Aynı sekmede yeni bir karta dokunulursa fragment değişir.
  window.addEventListener('hashchange', function () { load(); draw(); });

  installFavicon();

  load();
  draw();
})();
</script>
</body>
</html>

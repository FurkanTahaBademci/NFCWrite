<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Kişi Kartı</title>
<!--
  Çözücü sayfa https://nfckart.github.io/v/ adresine taşındı.
  Bu dosya yalnızca eski kartlar için köprüdür.

  Neden istemci tarafında JS:
  Kişi verisi URL fragment'ında (#) taşınır ve fragment tarayıcı tarafından
  sunucuya GÖNDERİLMEZ. Dolayısıyla sunucu tarafı bir 301 veriyi taşıyamazdı
  — üstelik GitHub Pages statik sunucudur, yönlendirme kuralı da desteklemez.
  Fragment'ı yalnızca burada, tarayıcının içinde yeni adrese aktarabiliriz.

  DİKKAT — bu dosya silinemez, taşınamaz.
  Bu adres eski fiziksel kartlara kalıcı yazılı. Dosya kalkarsa o kartlar
  kırılır. Yeni kartlar doğrudan nfckart.github.io/v/ adresini taşır.
  Sözleşme: .claude/docs/adr/ADR-0006-resolver-url-permanence.md
-->
<script>
  (function () {
    var hash = window.location.hash || '';
    window.location.replace('https://nfckart.github.io/v/' + hash);
  })();
</script>
</head>
<body>
<noscript><a href="https://nfckart.github.io/v/">Kişi kartını görüntüle →</a></noscript>
</body>
</html>
